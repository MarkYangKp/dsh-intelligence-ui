name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  OPENUI_TELEMETRY_DISABLED: '1'
  DO_NOT_TRACK: '1'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: google-chrome --version
      - run: pnpm test
      - run: pnpm test:docs
      - run: pnpm format:check
      - run: node scripts/check-bundle-size.mjs
      # the compiled bundle is committed on purpose: fail if src/ drifted from lib/client.js
      - run: git diff --exit-code lib/client.js

  design-gates:
    name: design + interaction gates (headless Chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:design
      - run: pnpm test:interact
